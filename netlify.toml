[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "${NETLIFY_DATABASE_URL}"
  # Stripe（支付）- 在 Netlify 控制台配置实际值
  # STRIPE_PUBLIC_KEY = ""
  # STRIPE_SECRET_KEY = ""
  # STRIPE_WEBHOOK_SECRET = ""
  # PayPal（支付 - 可选）- 在 Netlify 控制台配置实际值
  # PAYPAL_CLIENT_ID = ""
  # PAYPAL_CLIENT_SECRET = ""
  UPSTASH_REDIS_REST_URL = "${UPSTASH_REDIS_REST_URL}"
  UPSTASH_REDIS_REST_TOKEN = "${UPSTASH_REDIS_REST_TOKEN}"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================
# Netlify Headers 配置 (v0.5.5)
# 用于配置静态资源的缓存策略和安全头
# ============================================

# 静态资源 - 长期缓存
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Next.js 构建资源 - 长期缓存
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js 运行时 - 不缓存
[[headers]]
  for = "/_next/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# API 路由 - 不缓存
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

# 图标和图片 - 长期缓存
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML 页面 - 安全头
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 全局安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ============================================
# Netlify Redirects 配置 (v0.5.5)
# 用于配置路由重定向规则
# ============================================

# 强制移除尾部斜杠
[[redirects]]
  from = "/*/$"
  to = "/:splat"
  status = 301

# 后台管理重定向
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 308

# 根路径重定向到首页或后台
[[redirects]]
  from = "/"
  to = "/admin"
  status = 302

# API 版本化预留 (未来 v2 升级使用)
[[redirects]]
  from = "/api/v1/*"
  to = "/api/:splat"
  status = 301
